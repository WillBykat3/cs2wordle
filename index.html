<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2Wordle</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header>
    <h1>CS2Wordle</h1>
    <span id="date"></span>
  </header>

  <p class="help">
    Every answer starts with CS2, so fill in the rest. New word every day.
    <span class="legend"><span class="tile correct">A</span> right spot</span>
    <span class="legend"><span class="tile present">A</span> wrong spot</span>
    <span class="legend"><span class="tile absent">A</span> not in it</span>
  </p>

  <div id="toast" role="status" aria-live="polite"></div>

  <main id="board" aria-label="Guesses"></main>

  <div id="keyboard" aria-label="Keyboard"></div>

  <script src="words.js?v=5"></script>
  <script src="game.js?v=5"></script>
</body>
</html>
